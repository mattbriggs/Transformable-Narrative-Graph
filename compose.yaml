name: tng

secrets:
  neo4j_auth:
    file: ./secrets/neo4j_auth.txt

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: tng-app:0.1.0
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      LOG_LEVEL: INFO
      CONFIDENCE_THRESHOLD: "0.6"
    secrets:
      - neo4j_auth
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - logs:/app/logs
    restart: unless-stopped

  neo4j:
    image: neo4j:2025.04.0-community
    environment:
      NEO4J_AUTH_FILE: /run/secrets/neo4j_auth
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    secrets:
      - neo4j_auth
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
  logs:
