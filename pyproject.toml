[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformable-narrative-graph"
version = "0.1.0"
description = "A graph-native system for representing, transforming, and rendering literary narratives"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matt Briggs", email = "matt.briggs@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "neo4j>=5.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "testcontainers[neo4j]>=4.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.scripts]
tng-api = "tng.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tng"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/tng --cov-report=term-missing --cov-report=html:htmlcov"
markers = [
    "integration: mark test as requiring a live Neo4j instance",
    "slow: mark test as slow",
]

[tool.coverage.run]
source = ["src/tng"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
